{% if request.user.is_authenticated %}
  {% with profile=request.user.profile %}
    <details class="mobile-top-profile" {% if request.resolver_match.url_name == 'my-profile' %}data-current="true"{% endif %}>
      <summary aria-label="Profile menu">
        <span class="mobile-profile-icon" aria-hidden="true">
          {% if profile.avatar_url %}
            <img src="{{ profile.avatar_url }}" alt="" referrerpolicy="no-referrer">
          {% else %}
            <b>{{ profile.avatar_symbol|default:"🌲" }}</b>
          {% endif %}
        </span>
        <span class="mobile-top-profile__arrow" aria-hidden="true"></span>
      </summary>
      <div class="mobile-top-profile__panel">
        <a href="{% url 'tree:my-profile' %}">My Profile</a>
        <a href="{% url 'tree:badges' %}">Badges</a>
        <a href="{% url 'tree:my-books' %}">My Books</a>
        <a href="{% url 'tree:challenges' %}">Challenges</a>
        <a href="{% url 'tree:donations' %}">Donations</a>
        <a href="{% url 'tree:logout' %}">Logout</a>
      </div>
    </details>
  {% endwith %}
{% endif %}
